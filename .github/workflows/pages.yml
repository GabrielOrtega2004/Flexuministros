name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio para la subruta del repositorio
        shell: bash
        run: |
          mkdir _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name _site \
            -exec cp -R {} _site/ \;
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.webmanifest' \) \
            -exec sed -i \
              -e 's|href="/|href="/Flexuministros/|g' \
              -e 's|src="/|src="/Flexuministros/|g' \
              -e "s|url('/|url('/Flexuministros/|g" \
              -e 's|url(/|url(/Flexuministros/|g' \
              -e 's|"src": "/|"src": "/Flexuministros/|g' {} +
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

